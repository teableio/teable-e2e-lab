name: Static checks

# The secrets-free line: everything here validates this repository's own code
# and runs on every push and every fork PR. The actual bug-regression run lives
# in e2e-lab.yml behind workflow_dispatch, because it needs the private
# teable-ee access token that fork PRs are (correctly) never handed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    # Well above the couple of minutes this takes. A bound at all is the point:
    # without one, a step that hangs rather than fails burns the default six
    # hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.13.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
