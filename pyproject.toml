[project]
name = "teable-api-lab"
version = "0.1.0"
description = "Teable API functional-acceptance lab: cases as data, runners as shared execution, results as evidence."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
lab = "framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the framework is a package. registry.py and cases/ are read from the
# working tree by path, which is what keeps a case id identical to its filename.
packages = ["framework"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["framework", "scripts", "registry.py"]
# Case files are loaded by path, not imported as modules; they are type-checked
# through the generic define_case signature at call time.
exclude = "^cases/"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Case files end in .case.py and are loaded by the registry, never collected.
python_files = ["test_*.py"]
